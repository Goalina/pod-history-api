            - name: CLUSTER_ID
              value: "gy003"
            - name: KUBECONFIG_PATH
              value: "/vault/secrets/gy003.yaml"
            - name: RETENTION_DAYS
              value: "30"
            - name: DATABASE_URL
              value: "postgresql://pod_history@pod-history-postgres:5432/pod_history"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: token-vol
          projected:
            sources:
              - serviceAccountToken:
                  audience: api
                  expirationSeconds: 600
                  path: token

