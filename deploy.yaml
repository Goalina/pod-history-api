---
# ── Collector: gy003 (远程集群，Vault 注入 kubeconfig) ─────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-history-collector-gy-003
  namespace: arc-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-history-collector-gy-003
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-perms-gy003.yaml: "0400"
        vault.hashicorp.com/agent-inject-secret-gy003.yaml: internal/data/ascend/npu-exporter
        vault.hashicorp.com/agent-inject-template-gy003.yaml: |
          {{- with secret "internal/data/ascend/npu-exporter" -}}
          {{ .Data.data.gy003 }}
          {{- end }}
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-service-account-token-volume-name: token-vol
        vault.hashicorp.com/role: pod-history-api
        vault.hashicorp.com/tls-skip-verify: "true"
      labels:
        app: pod-history-collector-gy-003
    spec:
      serviceAccountName: pod-history-api
      imagePullSecrets:
        - name: huawei-swr-image-pull-secret-model-gy
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: collector
          image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/pod-history-api:latest
          imagePullPolicy: Always
          env:
            - name: MODE
              value: "collector"
            - name: CLUSTER_ID
              value: "gy003"
            - name: KUBECONFIG_PATH
              value: "/vault/secrets/gy003.yaml"
            - name: RETENTION_DAYS
              value: "30"
            - name: DB_DIR
              value: "/data"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pod-history-data
        - name: token-vol
          projected:
            sources:
              - serviceAccountToken:
                  audience: api
                  expirationSeconds: 600
                  path: token

