  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-perms-gy003.yaml: "0400"
        vault.hashicorp.com/agent-inject-secret-gy003.yaml: internal/data/ascend/npu-exporter
        vault.hashicorp.com/agent-inject-template-gy003.yaml: |
          {{- with secret "internal/data/ascend/npu-exporter" -}}
          {{ .Data.data.gy003 }}
          {{- end }}
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-service-account-token-volume-name: token-vol
        vault.hashicorp.com/role: pod-history-api
        vault.hashicorp.com/tls-skip-verify: "true"
      labels:
        app: pod-history-collector-gy-003
    spec:
      serviceAccountName: pod-history-api
      imagePullSecrets:
        - name: huawei-swr-image-pull-secret-model-gy
