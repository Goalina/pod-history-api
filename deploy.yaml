# ============================================================
# Pod 历史记录服务 — K8s 部署清单（PostgreSQL 存储）
# kubectl apply -f deploy.yaml
# ============================================================

---
# ── PostgreSQL PVC (RWO，仅 PG 自身使用) ──────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pod-history-pg-data
  namespace: arc-history
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-disk   # 按集群实际 StorageClass 修改
  resources:
    requests:
      storage: 20Gi

---
# ── PostgreSQL StatefulSet ─────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pod-history-postgres
  namespace: arc-history
spec:
  serviceName: pod-history-postgres
  replicas: 1
  selector:
    matchLabels:
      app: pod-history-postgres
  template:
    metadata:
      labels:
        app: pod-history-postgres
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: postgres
          image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "pod_history"
            - name: POSTGRES_USER
              value: "pod_history"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "trust"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pod_history"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pod-history-pg-data

---
# ── PostgreSQL Service (ClusterIP) ────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pod-history-postgres
  namespace: arc-history
spec:
  selector:
    app: pod-history-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-history-api-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["actions.github.com"]
    resources: ["ephemeralrunners"]
    verbs: ["get", "list"]

---
# ── API Server ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-history-api-server
  namespace: arc-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-history-api-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pod-history-api-server
    spec:
      serviceAccountName: pod-history-api
      imagePullSecrets:
        - name: huawei-swr-image-pull-secret-model-gy
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: api
          image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/pod-history-api:20260831-1132
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODE
              value: "api"
            - name: PORT
              value: "8080"
            - name: RETENTION_DAYS
              value: "30"
            - name: DATABASE_URL
              value: "postgresql://pod_history@pod-history-postgres:5432/pod_history"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30

