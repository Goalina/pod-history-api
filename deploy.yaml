# ============================================================
# Pod 历史记录服务 — K8s 部署清单（SQLite 存储）
# kubectl apply -f deploy.yaml
# ============================================================

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pod-history-data
  namespace: arc-history
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: csi-sfsturbo
  resources:
    requests:
      storage: 100Gi

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-history-api-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["actions.github.com"]
    resources: ["ephemeralrunners"]
    verbs: ["get", "list"]

---
# ── API Server ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-history-api-server
  namespace: arc-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-history-api-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pod-history-api-server
    spec:
      serviceAccountName: pod-history-api
      imagePullSecrets:
        - name: huawei-swr-image-pull-secret-model-gy
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: api
          image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/pod-history-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODE
              value: "api"
            - name: PORT
              value: "8080"
            - name: RETENTION_DAYS
              value: "30"
            - name: DB_DIR
              value: "/data"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pod-history-data

